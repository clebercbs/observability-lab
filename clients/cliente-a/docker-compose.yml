services:

  prometheus:
    image: prom/prometheus:latest
    container_name: ${CLIENT_NAME}_prometheus
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/clients:/etc/prometheus/clients
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    restart: unless-stopped
    networks:
      - msp-network

  loki:
    image: grafana/loki:latest
    container_name: ${CLIENT_NAME}_loki
    volumes:
      - loki-data:/loki
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - msp-network

  grafana:
    image: grafana/grafana:latest
    container_name: ${CLIENT_NAME}_grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=alexanderzobnin-zabbix-app
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    restart: unless-stopped
    networks:
      - msp-network
      - proxy-network

  portainer:
    image: portainer/portainer-ce:latest
    container_name: ${CLIENT_NAME}_portainer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    restart: unless-stopped
    networks:
      - msp-network

  zabbix-db:
    image: postgres:15
    container_name: ${CLIENT_NAME}_zabbix-db
    environment:
      POSTGRES_DB: ${ZABBIX_DB_NAME}
      POSTGRES_USER: ${ZABBIX_DB_USER}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - zabbix-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - msp-network

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:latest
    container_name: ${CLIENT_NAME}_zabbix-server
    depends_on:
      - zabbix-db
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: ${ZABBIX_DB_USER}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}
    restart: unless-stopped
    networks:
      - msp-network

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:latest
    container_name: ${CLIENT_NAME}_zabbix-web
    depends_on:
      - zabbix-server
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: ${ZABBIX_DB_USER}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: America/Sao_Paulo
    restart: unless-stopped
    networks:
      - msp-network

networks:
  msp-network:
    name: ${CLIENT_NAME}_msp-network
  proxy-network:
    external: true
    name: msp_proxy_network

volumes:
  grafana-data:
    name: ${CLIENT_NAME}_grafana-data
  prometheus-data:
    name: ${CLIENT_NAME}_prometheus-data
  loki-data:
    name: ${CLIENT_NAME}_loki-data
  zabbix-db-data:
    name: ${CLIENT_NAME}_zabbix-db-data
  portainer-data:
    name: ${CLIENT_NAME}_portainer-data
